name: Localize Wix assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-assets.yml'

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Wix-hosted assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/site
          curl -fL --retry 3 'https://static.wixstatic.com/media/ea77ec_1748e1c3afc54469a42405b971163611~mv2.png' -o assets/site/pulse-report.png
          curl -fL --retry 3 'https://static.wixstatic.com/media/ea77ec_0fdd679246594063a46b12f63fbca48e~mv2.png' -o assets/site/node-system.png
          curl -fL --retry 3 'https://static.wixstatic.com/media/ea77ec_ee99dff3d55d465295208940db5cbb02~mv2.png' -o assets/site/nbn.png
          curl -fL --retry 3 'https://static.wixstatic.com/media/ea77ec_89ed7da9f4884c2ca671e03c1c706aba~mv2.png' -o assets/site/coeliac-australia.png
          curl -fL --retry 3 'https://static.wixstatic.com/media/aee4f3_fa5172212a4646fdae4379f56bc2af13~mv2.jpg' -o assets/site/lizzie.jpg
          curl -fL --retry 3 'https://static.wixstatic.com/media/aee4f3_dc81a4fd6d1644d38c403ab5447704e5~mv2.jpg' -o assets/site/lachlan.jpg
          curl -fL --retry 3 'https://static.wixstatic.com/media/aee4f3_cdd217ce58dd4592a6daf01e9e5247e7~mv2.jpg' -o assets/site/cliff.jpg
          curl -fL --retry 3 'https://static.wixstatic.com/media/aee4f3_109b25cf7b0d4467a384bcf92937655c~mv2.png' -o assets/site/hero.png
          curl -fL --retry 3 'https://static.wixstatic.com/media/ea77ec_cf1611ecc5d949d5ab5b88390412dd52~mv2.gif' -o assets/site/hero.gif
          curl -fL --retry 3 'https://static.wixstatic.com/media/ea77ec_866a9e2f4d754521a64db665ad034266~mv2.png' -o assets/site/silos.png
          curl -fL --retry 3 'https://static.wixstatic.com/media/ea77ec_b4383a86779944ada93d8f8a88354740~mv2.jpg' -o assets/site/advisory-background-old.jpg
          curl -fL --retry 3 'https://static.wixstatic.com/media/ea77ec_7eb9e732f3a5482a98b33939391e5fe6~mv2.jpg' -o assets/site/advisory-background.jpg

      - name: Replace Wix URLs with local assets
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            'https://static.wixstatic.com/media/ea77ec_1748e1c3afc54469a42405b971163611~mv2.png': 'assets/site/pulse-report.png',
            'https://static.wixstatic.com/media/ea77ec_0fdd679246594063a46b12f63fbca48e~mv2.png': 'assets/site/node-system.png',
            'https://static.wixstatic.com/media/ea77ec_ee99dff3d55d465295208940db5cbb02~mv2.png': 'assets/site/nbn.png',
            'https://static.wixstatic.com/media/ea77ec_89ed7da9f4884c2ca671e03c1c706aba~mv2.png': 'assets/site/coeliac-australia.png',
            'https://static.wixstatic.com/media/aee4f3_fa5172212a4646fdae4379f56bc2af13~mv2.jpg': 'assets/site/lizzie.jpg',
            'https://static.wixstatic.com/media/aee4f3_dc81a4fd6d1644d38c403ab5447704e5~mv2.jpg': 'assets/site/lachlan.jpg',
            'https://static.wixstatic.com/media/aee4f3_cdd217ce58dd4592a6daf01e9e5247e7~mv2.jpg': 'assets/site/cliff.jpg',
            'https://static.wixstatic.com/media/aee4f3_109b25cf7b0d4467a384bcf92937655c~mv2.png': 'assets/site/hero.png',
            'https://static.wixstatic.com/media/ea77ec_cf1611ecc5d949d5ab5b88390412dd52~mv2.gif': 'assets/site/hero.gif',
            'https://static.wixstatic.com/media/ea77ec_866a9e2f4d754521a64db665ad034266~mv2.png': 'assets/site/silos.png',
            'https://static.wixstatic.com/media/ea77ec_b4383a86779944ada93d8f8a88354740~mv2.jpg': 'assets/site/advisory-background-old.jpg',
            'https://static.wixstatic.com/media/ea77ec_7eb9e732f3a5482a98b33939391e5fe6~mv2.jpg': 'assets/site/advisory-background.jpg',
          }

          for filename in ['index.html', 'styles.css', 'asset-overrides.css', 'source-fidelity.css', 'fidelity.css', 'script.js', 'benchmark.css', 'motion-fidelity.css']:
              p = Path(filename)
              if not p.exists():
                  continue
              text = p.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text)

      - name: Verify no Wix-hosted site assets remain
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=.git --exclude='localize-assets.yml' 'static\.wixstatic\.com\|filesusr\.com' .; then
            echo 'Wix-hosted dependency remains.'
            exit 1
          fi
          file assets/site/*

      - name: Commit localized assets and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/localize-assets.yml
          git add assets/site index.html styles.css asset-overrides.css source-fidelity.css fidelity.css script.js benchmark.css motion-fidelity.css
          git commit -m 'Localize remaining Wix site assets'
          git push
